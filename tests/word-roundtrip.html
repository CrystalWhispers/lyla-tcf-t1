<!doctype html><meta charset="utf-8"><title>Word round trip check</title><script src="vendor/jszip.min.js"></script><pre id="result">Running</pre><script type="module">
import{createWord,readWordFile}from'./docx.js';import{SAMPLE_RECORDS,parseParagraphs,inspectProfile,practiceGroups}from'./core.js';
try{const blob=await createWord(SAMPLE_RECORDS);const records=await readWordFile({name:'roundtrip.docx',size:blob.size,arrayBuffer:()=>blob.arrayBuffer()});const actual=parseParagraphs(records).profile,expected=parseParagraphs(SAMPLE_RECORDS).profile;const summarize=p=>JSON.stringify(p.modules.map(m=>m.paragraphs.map(a=>({text:a.text,keywords:a.keywords.map(k=>({start:k.start,end:k.end,text:k.text}))}))));if(summarize(actual)!==summarize(expected)||actual.questions.length!==2||inspectProfile(actual).errors.length)throw Error('Round trip mismatch');document.getElementById('result').textContent='PASS: Word export and re-import preserve all six modules, every source paragraph, every bold keyword offset, and two follow-up questions.'}catch(e){document.getElementById('result').textContent='FAIL '+e.message}
</script>
