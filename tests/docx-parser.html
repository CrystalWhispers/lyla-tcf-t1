<!doctype html><meta charset="utf-8"><title>Word parser regression checks</title><pre id="result">Running</pre><script type="module">
import{extractWordRecords}from'./docx.js';
const ns='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const styles=`<w:styles xmlns:w="${ns}"><w:style w:type="paragraph" w:default="1" w:styleId="Normal"/><w:style w:type="character" w:styleId="BoldChar"><w:rPr><w:b/></w:rPr></w:style><w:style w:type="character" w:styleId="Inherited"><w:basedOn w:val="BoldChar"/></w:style><w:style w:type="paragraph" w:styleId="BoldPara"><w:rPr><w:b/></w:rPr></w:style></w:styles>`;
const xml=`<w:document xmlns:w="${ns}"><w:body><w:p><w:r><w:t>Je viens de </w:t></w:r><w:r><w:rPr><w:rStyle w:val="Inherited"/></w:rPr><w:t>Montréal</w:t></w:r><w:r><w:t>.</w:t></w:r></w:p><w:p><w:pPr><w:pStyle w:val="BoldPara"/></w:pPr><w:r><w:rPr><w:b w:val="0"/></w:rPr><w:t>Plain </w:t></w:r><w:r><w:t>bold</w:t></w:r></w:p><w:p><w:r><w:t>Je </w:t></w:r><w:del><w:r><w:t>DELETE </w:t></w:r></w:del><w:r><w:rPr><w:vanish/></w:rPr><w:t>HIDDEN</w:t></w:r><w:r><w:rPr><w:b/></w:rPr><w:t>lis &amp; écris</w:t></w:r><w:r><w:t>.</w:t></w:r></w:p></w:body></w:document>`;
try{const r=extractWordRecords(xml,styles);const expected=[{text:'Je viens de Montréal.',ranges:[{start:12,end:20}]},{text:'Plain bold',ranges:[{start:6,end:10}]},{text:'Je lis & écris.',ranges:[{start:3,end:14}]}];if(JSON.stringify(r)!==JSON.stringify(expected))throw Error(JSON.stringify(r));document.getElementById('result').textContent='PASS: inherited character styles, paragraph styles, explicit bold-off, deleted and hidden text, XML entities, exact source offsets.'}catch(e){document.getElementById('result').textContent='FAIL: '+e.message}
</script>
